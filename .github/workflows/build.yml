name: Build Forge Mod

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Build mod jars
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Verify expected output jar exists
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/*.jar)
          release_jars=()

          for jar in "${jars[@]}"; do
            if [[ "$jar" != *-slim.jar ]]; then
              release_jars+=("$jar")
            fi
          done

          if [[ ${#release_jars[@]} -eq 0 ]]; then
            echo "No release jar found in build/libs"
            exit 1
          fi

          if [[ ${#release_jars[@]} -gt 1 ]]; then
            echo "More than one non-slim jar found:"
            printf ' - %s\n' "${release_jars[@]}"
            exit 1
          fi

          echo "RELEASE_JAR=${release_jars[0]}" >> "$GITHUB_ENV"
          echo "Verified release jar: ${release_jars[0]}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            ${{ env.RELEASE_JAR }}
            changelog.txt
            LICENSE
          if-no-files-found: error
          compression-level: 0
